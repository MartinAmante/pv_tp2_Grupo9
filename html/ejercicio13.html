<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 13</title>
</head>
<body>
    <h1>Ejercicio 13</h1>
    <script>
        let numeros = [];
        let cantidadArreglo = prompt("ingresa una cantidad de numeros que quieres guardar");
        const mostrarArreglo = numero => {

        if(cantidadArreglo != null && cantidadArreglo != 0 ){
            while (numeros.length < cantidadArreglo)
            {
              let num = prompt("agrega un numero al arreglo");
              numeros.push(num);
              alert(`numero ${num} agregado`);
            }     
        }
        else
        {
          return `no se agrego una cantidad para el arreglo`;
        }    
        for(let i = 0; i < numeros.length; i++)
            {
                alert(numeros[i]);
            }  
        return `Arreglo final ${numero} `;
       }
        alert(mostrarArreglo(numeros));
    </script>
</body>
</html>
