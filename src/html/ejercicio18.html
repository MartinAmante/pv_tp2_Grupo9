<!DOCTYPE html>

<head>

<body>
    <script>
        const calcularMayor = (numero1, numero2) => {
            if (numero1 > numero2) {
                alert(`El mayor es ${numero1}`);
            }else if (numero1 < numero2) {
                alert(`El mayor es ${numero2}`);
            }else {
                alert("Los numero son iguales");
            }
        };

        let num1 = Number(prompt("Ingrese primer numero"));
        let num2 = Number(prompt("Ingrese segundo numero"));

        calcularMayor(num1, num2);
    </script>
</body>
</html>
